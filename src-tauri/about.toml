# Settings for the third-party notices (tools/notices.mjs, run by the release workflow; docs/RELEASING.md).
# Every licence the app's Rust libraries use must be listed here; a new one stops the release until someone checks it
# is compatible with MIT (no GPL or AGPL). Ordered from most to least preferred when a library offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# The app ships for Windows: list only the libraries in that build.
targets = ["x86_64-pc-windows-msvc"]
# Development-only libraries (tests, build tools) are not part of the installed app.
ignore-dev-dependencies = true
ignore-build-dependencies = false
