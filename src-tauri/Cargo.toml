[package]
name = "keyoverlay"
version = "1.2.0"
description = "Keystroke overlay for streaming (OBS Browser Source)"
license = "MIT"
repository = "https://github.com/nqble/keystroke-overlay"
readme = "../README.md"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "macros", "rt", "rt-multi-thread"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

# Smaller debug builds (saves roughly 1.5 GB of disk). Set debug = 2 when you need to step through code in a debugger.
[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
