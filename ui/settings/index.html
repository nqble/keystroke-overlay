<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keystroke Overlay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- Critical style inline: the very first paint is already dark (no white flash before settings.css loads). -->
    <style>
      html,
      body {
        background: #12141a;
        color: #e6e9f0;
      }
    </style>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header data-tauri-drag-region data-test="app-header">
      <div class="brand" data-tauri-drag-region>
        <img
          data-test="brand-logo"
          class="logo"
          src="logo.png"
          alt=""
          width="26"
          height="26"
          draggable="false"
          data-tauri-drag-region
        /><span data-test="brand-title" data-tauri-drag-region>Keystroke Overlay</span>
        <span id="obsStatus" class="obs-status off" data-test="obs-status" role="status"></span>
      </div>
      <div class="obs" data-tauri-drag-region>
        <span class="lbl" data-tauri-drag-region>OBS Browser Source URL</span>
        <input id="obsUrl" data-test="obs-url" readonly />
        <button id="copyUrl" data-test="obs-copy" class="primary">Copy OBS URL</button>
        <span id="obsSize" data-test="obs-size" class="hint" data-tauri-drag-region></span>
      </div>
      <div class="winbtns" data-test="window-buttons">
        <button
          id="wMin"
          data-test="window-minimize"
          type="button"
          tabindex="-1"
          aria-label="Minimize"
          title="Minimize"
        >
          &#xE921;
        </button>
        <button
          id="wMax"
          data-test="window-maximize"
          type="button"
          tabindex="-1"
          aria-label="Maximize"
          title="Maximize"
        >
          &#xE922;
        </button>
        <button id="wClose" data-test="window-close" type="button" tabindex="-1" aria-label="Close" title="Close">
          &#xE8BB;
        </button>
      </div>
    </header>
    <div id="banner" data-test="server-banner" hidden></div>
    <div id="pausebar" data-test="pause-bar" hidden>
      ⏸ Overlay is paused — keystrokes are hidden in OBS.
      <button id="resumeBtn" data-test="pause-resume">Resume</button>
    </div>
    <section class="preview" id="previewBox">
      <iframe id="preview" data-test="preview-frame" title="Live preview"></iframe>
    </section>
    <main>
      <nav id="tabs" data-test="tab-bar"></nav>
      <div id="pane" data-test="pane"></div>
    </main>
    <div id="modal" data-test="notes-popup" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <h3 id="mTitle" data-test="notes-title"></h3>
        <div id="mBody" data-test="notes-body"></div>
        <div class="mfoot"><button id="mOk" data-test="notes-ok" class="primary">OK</button></div>
      </div>
    </div>
    <button
      id="updateBtn"
      data-test="update-button"
      class="upd"
      type="button"
      hidden
      aria-label="New update"
      data-tip="New update"
    >
      <svg
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="#fff"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 4v10" />
        <path d="M7.5 10.5 12 15l4.5-4.5" />
        <path d="M5 19h14" />
      </svg>
    </button>
    <div id="updModal" data-test="update-popup" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="uTitle">
        <h3 id="uTitle" data-test="update-title"></h3>
        <div id="uBody" data-test="update-body"></div>
        <div class="bar" id="uBar" data-test="update-progress" hidden><div class="fill" id="uFill"></div></div>
        <div class="hint" id="uText" data-test="update-progress-text"></div>
        <div class="mfoot">
          <button id="uLater" data-test="update-later" type="button">Later</button
          ><button id="uGo" data-test="update-go" type="button" class="primary">Update now</button>
        </div>
      </div>
    </div>
    <div id="dlg" data-test="dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle">
        <h3 id="dTitle" data-test="dialog-title"></h3>
        <div id="dBody" data-test="dialog-body"></div>
        <div class="mfoot" id="dFoot" data-test="dialog-footer"></div>
      </div>
    </div>
    <div id="toast" data-test="toast" hidden></div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
