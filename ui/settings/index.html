<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keystroke Overlay</title>
    <!-- no icon: stops the window asking for /favicon.ico -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- Critical style inline: the very first paint is already dark (no white flash before settings.css loads). -->
    <style>
      html,
      body {
        background: #12141a;
        color: #e6e9f0;
      }
    </style>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header data-tauri-drag-region data-test="app-header">
      <div class="brand" data-tauri-drag-region>
        <img
          data-test="brand-logo"
          class="logo"
          src="logo.png"
          alt=""
          width="26"
          height="26"
          draggable="false"
          data-tauri-drag-region
        /><span data-test="brand-title" data-tauri-drag-region>Keystroke Overlay</span>
      </div>
      <div class="header-status" data-tauri-drag-region>
        <button
          id="obsStatus"
          class="obs-status off"
          data-test="obs-status"
          type="button"
          aria-live="polite"
          title="OBS link settings"
        ></button>
        <button id="copyUrl" data-test="obs-copy" class="primary" type="button" hidden>Copy OBS link</button>
        <button id="updateBtn" data-test="update-button" class="update-chip" type="button" hidden>
          <span class="update-arrow-box" aria-hidden="true"><span class="update-arrow">↓</span></span
          >Update ready
        </button>
      </div>
      <div class="winbtns" data-test="window-buttons">
        <button
          id="wMin"
          data-test="window-minimize"
          type="button"
          tabindex="-1"
          aria-label="Minimize"
          title="Minimize"
        >
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" /></svg>
        </button>
        <button
          id="wMax"
          data-test="window-maximize"
          type="button"
          tabindex="-1"
          aria-label="Maximize"
          title="Maximize"
        >
          <svg class="icon-maximize" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="0.5" width="9" height="9" />
          </svg>
          <svg class="icon-restore" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2.5 2.5V0.5h7v7h-2" />
            <rect x="0.5" y="2.5" width="7" height="7" />
          </svg>
        </button>
        <button id="wClose" data-test="window-close" type="button" tabindex="-1" aria-label="Close" title="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" /></svg>
        </button>
      </div>
    </header>
    <div id="banner" data-test="server-banner" hidden></div>
    <section class="preview" id="previewBox">
      <iframe id="preview" data-test="preview-frame" title="Live preview" tabindex="-1"></iframe>
      <button
        id="pauseBtn"
        class="pause-btn"
        data-test="pause-overlay"
        type="button"
        aria-pressed="false"
        aria-label="Pause overlay"
      >
        <span class="pause-cap pause-cap-left" aria-hidden="true"></span
        ><span class="pause-mid" aria-hidden="true"></span><span class="pause-cap" aria-hidden="true"></span
        ><span class="pause-word" aria-hidden="true">Pause</span><span class="pause-icon" aria-hidden="true">⏸</span>
      </button>
    </section>
    <main>
      <nav id="tabs" data-test="tab-bar" aria-label="Settings sections"></nav>
      <div id="pane" class="scroll-fade" data-test="pane"></div>
    </main>
    <div id="modal" data-test="notes-popup" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <h3 id="mTitle" data-test="notes-title"></h3>
        <div id="mBody" class="scroll-fade" data-test="notes-body"></div>
        <div class="mfoot"><button id="mOk" data-test="notes-ok" class="primary">OK</button></div>
      </div>
    </div>
    <div id="updModal" data-test="update-popup" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="uTitle">
        <h3 id="uTitle" data-test="update-title"></h3>
        <div id="uBody" class="scroll-fade" data-test="update-body"></div>
        <div class="bar" id="uBar" data-test="update-progress" hidden><div class="fill" id="uFill"></div></div>
        <div class="hint" id="uText" data-test="update-progress-text"></div>
        <div class="mfoot">
          <button id="uLater" data-test="update-later" type="button">Later</button
          ><button id="uGo" data-test="update-go" type="button" class="primary">Update now</button>
        </div>
      </div>
    </div>
    <div id="dlg" data-test="dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle">
        <h3 id="dTitle" data-test="dialog-title"></h3>
        <div id="dBody" class="scroll-fade" data-test="dialog-body"></div>
        <div class="mfoot" id="dFoot" data-test="dialog-footer"></div>
      </div>
    </div>
    <div id="toast" data-test="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
