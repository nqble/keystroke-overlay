name: E2E (Windows)

# Runs on every pull request, and by hand: GitHub -> Actions -> "E2E (Windows)" -> Run workflow. It runs the full end-to-end suite
# (npm run test:e2e) on one of GitHub's Windows machines: it builds a throwaway test copy of the app and drives it for
# real (see tests/e2e/run.mjs). About 15-25 minutes. It does not block anything yet. Once a few runs pass reliably, it can
# become a required step of the Release workflow (docs/RELEASING.md). If a run fails, open the log: a real bug and a
# limitation of GitHub's machines (no real desktop, no injected key presses) look different there.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'One suite only (for example smoke or secure-link), or "all"'
        default: all

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: End-to-end tests
        shell: bash
        env:
          SUITE: ${{ inputs.suite || 'all' }} # through the environment, never pasted into the script; a pull request runs all
          E2E_DIAGNOSTICS: ${{ runner.temp }}/e2e-diagnostics # a failed suite saves a screenshot and report here
        run: |
          if [ "$SUITE" = "all" ]; then npm run test:e2e; else npm run test:e2e -- --suite "$SUITE"; fi
      - name: Keep the diagnostics of failed suites
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7
