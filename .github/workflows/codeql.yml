name: CodeQL

# GitHub's code scanner: reads our own JavaScript and Rust looking for known bug and vulnerability patterns.
# Manual only (nothing runs by itself): GitHub -> Actions -> "CodeQL" -> Run workflow. Takes roughly 5-10 minutes.
# Results appear under the repository's Security tab -> Code scanning.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # lets the scan upload its findings to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: /language:${{ matrix.language }}
