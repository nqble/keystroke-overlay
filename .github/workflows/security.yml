name: Security scan

# Manual only. Nothing here runs by itself and nothing here can block a release.
# GitHub -> Actions -> "Security scan" -> Run workflow. It takes about 2-4 minutes and ends green (nothing found) or red (read the log).
#
# It checks the libraries the app is built from against the public lists of known vulnerabilities:
#   - JavaScript libraries: npm audit (only the ones that ship in the app, high severity and above)
#   - Rust libraries: cargo audit (RustSec advisory database)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript libraries (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust libraries (cargo audit)
        run: cargo audit --file src-tauri/Cargo.lock
