name: Release

# One click (or one tag) builds, signs and publishes a release. See docs/RELEASING.md.
#
#   Option A (easiest):  GitHub -> Actions -> "Release" -> Run workflow -> type the version (e.g. 1.2.0) -> Run
#   Option B:            push a tag named v<version> (e.g. v1.2.0)
#
# The version comes from src-tauri/tauri.conf.json and must have an entry in CHANGELOG.md (that text becomes the release notes).
# Safety: only a commit that is on main can be released; every action is pinned to an exact commit (Dependabot proposes
# updates for review); this job uses no shared build cache, so nothing another workflow wrote can end up in a signed
# installer; and the "release" environment asks Jordan to approve before the signing key is used.
#
# Windows code signing (free, from SignPath Foundation; docs/RELEASING.md, Code signing): once the repository variable
# SIGNPATH_ORGANIZATION_ID is set, the app's .exe and then the installer are sent to SignPath to be signed, and each
# signing request waits for Jordan's approval there. Until it is set, the release is built unsigned, as before.
#
# x.y.0 versions are also promoted to the Stable channel automatically; x.y.z patch releases are Latest-only unless you tick
# "Also make this the Stable version" (for an important fix that Stable users must get).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, typed to confirm (must match tauri.conf.json, e.g. 1.2.0)'
        required: true
      promote_to_stable:
        description: 'Also make this the Stable version (an important fix that Stable-channel users must get). x.y.0 versions always are.'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: windows-latest
    environment: release # Settings -> Environments -> release -> Required reviewers: Jordan must approve each run
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target # a known place, so the signing steps can find the files
      CODE_SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    # The update signing key is given only to the two steps below that use it, never to the job: other steps run
    # third-party actions (upload, SignPath), which must not see it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the whole history, to check the commit is on main
      - name: Only release a commit that is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Merge it into main first. Nothing was released."; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci

      - name: Work out the version and make sure it is safe to release
        id: v
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]] || [ "${{ inputs.promote_to_stable }}" = "true" ]; then echo "stable=true" >> "$GITHUB_OUTPUT"; else echo "stable=false" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.version }}" != "$VERSION" ]; then
            echo "::error::You typed '${{ inputs.version }}' but the app's version is '$VERSION'. Nothing was released."; exit 1; fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match the app version v$VERSION. Nothing was released."; exit 1; fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Nothing was released."; exit 1; fi
          node tools/changelog-section.mjs "$VERSION" > notes.md   # fails if CHANGELOG.md has no entry for this version

      - name: Tests and privacy check
        run: npm test

      - name: Build the app
        run: node tools/release.mjs --stage app

      # The licenses of the libraries inside the app, which go with the installer (docs/RELEASING.md). Stops the
      # release if a library uses a license not accepted in src-tauri/about.toml.
      - name: Write the third-party notices
        shell: bash
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          node tools/notices.mjs

      # ---- Code signing, step 1: the app itself (it is packed into the installer next, so it is signed first)
      - name: Hand the app to SignPath
        if: env.CODE_SIGNING == 'true'
        id: app-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          path: target/release/keyoverlay.exe
          if-no-files-found: error
      - name: Sign the app (waits for Jordan's approval in SignPath)
        if: env.CODE_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.app-upload.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600 # time to approve it
          output-artifact-directory: target/release # the signed .exe replaces the unsigned one

      - name: Pack the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }} # empty until the key has a password
        run: node tools/release.mjs --stage installer

      # ---- Code signing, step 2: the installer
      - name: Hand the installer to SignPath
        if: env.CODE_SIGNING == 'true'
        id: installer-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Sign the installer (waits for Jordan's approval in SignPath)
        if: env.CODE_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.installer-upload.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release/bundle/nsis
      - name: Check both signatures are valid
        if: env.CODE_SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($file in @('target/release/keyoverlay.exe') + (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { Write-Error "$file is not validly signed: $($signature.Status). Nothing was released."; exit 1 }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Sign the installer for the updater and write the update manifests
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          FLAG=""; [ "${{ steps.v.outputs.stable }}" = "true" ] && FLAG="--stable"
          node tools/release.mjs --stage finish $FLAG "$(node tools/changelog-section.mjs '${{ steps.v.outputs.version }}' --title)"

      - name: Publish the GitHub release
        shell: bash
        run: |
          V='${{ steps.v.outputs.version }}'
          gh release create "v$V" "release/$V/Keystroke-Overlay_${V}_x64-setup.exe" "release/$V/latest.json" release/THIRD-PARTY-NOTICES.html \
            --title "v$V" --notes-file notes.md --target "${{ github.sha }}"

      - name: Promote to the Stable channel (x.y.0 releases, or when you ticked the box)
        if: steps.v.outputs.stable == 'true'
        shell: bash
        run: |
          V='${{ steps.v.outputs.version }}'
          gh release view channel-stable > /dev/null 2>&1 || gh release create channel-stable --prerelease \
            --title "Stable channel" --notes "Holds stable.json for the Stable update channel. Managed automatically; please do not edit."
          gh release upload channel-stable "release/$V/stable.json" --clobber
