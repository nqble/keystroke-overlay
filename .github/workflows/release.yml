name: Release

# One click (or one tag) builds, signs and publishes a release. See docs/RELEASING.md.
#
#   Option A (easiest):  GitHub -> Actions -> "Release" -> Run workflow -> type the version (e.g. 1.2.0) -> Run
#   Option B:            push a tag named v<version> (e.g. v1.2.0)
#
# The version comes from src-tauri/tauri.conf.json and must have an entry in CHANGELOG.md (that text becomes the release notes).
# Safety: only a commit that is on main can be released; every action is pinned to an exact commit (Dependabot proposes
# updates for review); this job uses no shared build cache, so nothing another workflow wrote can end up in a signed
# installer; and the "release" environment asks the maintainer to approve before the signing key is used.
#
# Windows code signing (free, from SignPath Foundation; docs/RELEASING.md, Code signing): once the repository variable
# SIGNPATH_ORGANIZATION_ID is set, the app's .exe and then the installer are sent to SignPath to be signed, and each
# signing request waits for the maintainer's approval there. Until it is set, the release is built unsigned, as before.
#
# The Mac app: once the release is published, mac-app.yml builds the Apple Silicon app (no secrets, not signed by Apple)
# and mac-publish attaches Keystroke-Overlay_<version>_macOS-arm64.zip to the same release. Like linux-publish below, it
# then signs the app's update file (the .app.tar.gz) with the update key, in the "release" environment and in one step
# only, and adds darwin-aarch64 entries to latest.json and, for a Stable release, to stable.json: Macs update in the app
# (docs/RELEASING.md, Mac download). Between the two, mac-sign signs the app with the project's own Mac signing
# certificate (a self-made one, not Apple's), so macOS sees each update as the same app and keeps its keyboard
# permission (decision 0017); until the certificate's secrets exist it leaves the app signed ad hoc.
#
# The Linux downloads work the same way: linux-app.yml builds the AppImage and the .deb (no secrets) and linux-publish
# attaches them. linux-publish then signs the AppImage with the update key (it runs in the "release" environment, so it
# waits for the maintainer's approval like the Windows job, and only the signing step sees the key) and adds linux-x86_64 entries to
# latest.json and, for a Stable release, to stable.json: Linux users who run the AppImage update in the app. The .deb stays
# a download (docs/RELEASING.md, Linux download).
#
# x.y.0 versions are also promoted to the Stable channel automatically; x.y.z patch releases are Latest-only unless you tick
# "Also make this the Stable version" (for an important fix that Stable users must get).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, typed to confirm (must match tauri.conf.json, e.g. 1.2.0)'
        required: true
      promote_to_stable:
        description: 'Also make this the Stable version (an important fix that Stable-channel users must get). x.y.0 versions always are.'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: windows-latest
    environment: release # Settings -> Environments -> release -> Required reviewers: the maintainer must approve each run
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target # a known place, so the signing steps can find the files
      CODE_SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    # The update signing key is given only to the two steps below that use it, never to the job: other steps run
    # third-party actions (upload, SignPath), which must not see it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the whole history, to check the commit is on main
      - name: Only release a commit that is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Merge it into main first. Nothing was released."; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci

      - name: Work out the version and make sure it is safe to release
        id: v
        shell: bash
        # What a person typed or tagged reaches the script only as variables, never pasted into its code, so a value like
        # $(…) stays text (GitHub's advice on script injection).
        env:
          TYPED_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PROMOTE: ${{ inputs.promote_to_stable }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]] || [ "$PROMOTE" = "true" ]; then echo "stable=true" >> "$GITHUB_OUTPUT"; else echo "stable=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TYPED_VERSION" != "$VERSION" ]; then
            echo "::error::You typed '$TYPED_VERSION' but the app's version is '$VERSION'. Nothing was released."; exit 1; fi
          if [ "$EVENT_NAME" = "push" ] && [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG_NAME' does not match the app version v$VERSION. Nothing was released."; exit 1; fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Nothing was released."; exit 1; fi
          node tools/changelog-section.mjs "$VERSION" > notes.md   # fails if CHANGELOG.md has no entry for this version
          node tools/download-table.mjs "$VERSION" >> notes.md       # "Which file do I download?", just above the files

      - name: Tests and privacy check
        run: npm test

      - name: Build the app
        run: node tools/release.mjs --stage app

      # The licenses of the libraries inside the app, which go with the installer (docs/RELEASING.md). Stops the
      # release if a library uses a license not accepted in src-tauri/about.toml.
      - name: Write the third-party notices
        shell: bash
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          node tools/notices.mjs

      # ---- Code signing, step 1: the app itself (it is packed into the installer next, so it is signed first)
      - name: Hand the app to SignPath
        if: env.CODE_SIGNING == 'true'
        id: app-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          path: target/release/keyoverlay.exe
          if-no-files-found: error
      - name: Sign the app (waits for the maintainer's approval in SignPath)
        if: env.CODE_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.app-upload.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600 # time to approve it
          output-artifact-directory: target/release # the signed .exe replaces the unsigned one

      - name: Pack the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }} # empty until the key has a password
        run: node tools/release.mjs --stage installer

      # ---- Code signing, step 2: the installer
      - name: Hand the installer to SignPath
        if: env.CODE_SIGNING == 'true'
        id: installer-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Sign the installer (waits for the maintainer's approval in SignPath)
        if: env.CODE_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.installer-upload.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release/bundle/nsis
      - name: Check both signatures are valid
        if: env.CODE_SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($file in @('target/release/keyoverlay.exe') + (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { Write-Error "$file is not validly signed: $($signature.Status). Nothing was released."; exit 1 }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Sign the installer for the updater and write the update manifests
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          FLAG=""; [ "${{ steps.v.outputs.stable }}" = "true" ] && FLAG="--stable"
          node tools/release.mjs --stage finish $FLAG "$(node tools/changelog-section.mjs '${{ steps.v.outputs.version }}')"   # full notes: the in-app update dialog shows them

      - name: Publish the GitHub release
        shell: bash
        run: |
          V='${{ steps.v.outputs.version }}'
          gh release create "v$V" "release/$V/Keystroke-Overlay_${V}_x64-setup.exe" "release/$V/latest.json" release/THIRD-PARTY-NOTICES.html \
            --title "v$V" --notes-file notes.md --target "${{ github.sha }}"

      - name: Promote to the Stable channel (x.y.0 releases, or when you ticked the box)
        if: steps.v.outputs.stable == 'true'
        shell: bash
        run: |
          V='${{ steps.v.outputs.version }}'
          gh release view channel-stable > /dev/null 2>&1 || gh release create channel-stable --prerelease \
            --title "Stable channel" --notes "Holds stable.json for the Stable update channel. Managed automatically; please do not edit."
          gh release upload channel-stable "release/$V/stable.json" --clobber

  # ---- The Mac download. Runs only after the Windows release above succeeded (so only for an approved, published
  # release), builds with no secrets; mac-publish attaches the zip and adds the signed Mac update.
  mac-app:
    needs: release
    uses: ./.github/workflows/mac-app.yml

  # The app is signed with the project's Mac certificate here, not in mac-app.yml: the build keeps using no secrets, and the
  # certificate is only ever on this job's Mac, in a keychain that lasts for the job (docs/RELEASING.md, Mac download).
  mac-sign:
    needs: mac-app
    runs-on: macos-latest
    environment: release # the certificate lives here, next to the update key: this job waits for the maintainer's approval
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app
          path: mac-in
      - name: Unpack the app
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(cd mac-in && ls Keystroke-Overlay_*_macOS-arm64.zip)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          mkdir stage && ditto -x -k "mac-in/$ZIP" stage
          ls stage
      # The certificate goes into a keychain made for this job and deleted at its end; only this step sees it.
      - name: Sign the app with the project's Mac certificate
        shell: bash
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          APP="stage/Keystroke Overlay.app"
          if [ -z "${MAC_SIGNING_P12:-}" ]; then
            echo "::warning::No Mac signing certificate yet (MAC_SIGNING_P12): the app stays signed ad hoc, so Mac users renew the keyboard permission after this update."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # the certificate's fingerprint, not its name: a self-made certificate isn't trusted, so it isn't listed as "valid"
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/ 1\) /{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "::error::No signing identity in MAC_SIGNING_P12."; exit 1; }
          codesign --force --deep --sign "$IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --requirements - "$APP" # the rule macOS keeps the permission by: names the certificate
          security delete-keychain "$KEYCHAIN"
      - name: Pack the signed app again
        shell: bash
        run: |
          set -euo pipefail
          V=${ZIP#Keystroke-Overlay_}; V=${V%_macOS-arm64.zip}
          mkdir out
          ditto -c -k --sequesterRsrc stage "out/$ZIP"
          tar -czf "out/Keystroke-Overlay_${V}_macOS-arm64.app.tar.gz" -C stage "Keystroke Overlay.app"
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-signed
          path: out/*
          if-no-files-found: error
          retention-days: 14

  mac-publish:
    needs: mac-sign
    runs-on: ubuntu-latest
    environment: release # the update signing key lives here: this job waits for the maintainer's approval, like the Windows one
    # linux-publish edits the same latest.json and stable.json: one at a time, so neither overwrites the other's entry
    concurrency:
      group: update-manifests-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write # attach the files to the release and add the Mac entry to the update manifests
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The signing tool comes from package-lock.json (npm ci), the same pinned one the Windows job uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-signed
          path: mac-out
      - name: Attach the Mac download and its update file to the release
        shell: bash
        run: |
          cd mac-out
          ZIP=$(ls Keystroke-Overlay_*_macOS-arm64.zip)
          V=${ZIP#Keystroke-Overlay_}; V=${V%_macOS-arm64.zip}
          gh release upload "v$V" "$ZIP" "Keystroke-Overlay_${V}_macOS-arm64.app.tar.gz" --clobber --repo "${{ github.repository }}"

      # The key is given to this one step only. The app it signs was built by mac-app.yml, which has no secrets.
      - name: Sign the Mac update file and add the Mac to the update manifests
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PROMOTE: ${{ inputs.promote_to_stable }}
        run: |
          set -euo pipefail
          UPDATE=$(cd mac-out && ls Keystroke-Overlay_*_macOS-arm64.app.tar.gz)
          V=${UPDATE#Keystroke-Overlay_}; V=${V%_macOS-arm64.app.tar.gz}
          # --app-version puts the version inside the signature, so an old signed app can't be passed off as a new
          # version (the app has requireSignedVersion on; the AppImage and the Windows installer are signed the same way)
          npx --no-install tauri signer sign --app-version "$V" "mac-out/$UPDATE" # writes mac-out/<file>.sig
          SIGNATURE=$(cat "mac-out/$UPDATE.sig")
          [ -n "$SIGNATURE" ] || { echo "::error::No signature was written. The Mac entry was not added."; exit 1; }
          URL="https://github.com/${{ github.repository }}/releases/download/v$V/$UPDATE"
          # add the entry to a manifest, but only to the manifest of THIS version (never to an older Stable)
          add_mac() { # $1 = release tag that holds the manifest, $2 = manifest file name
            mkdir -p manifests && gh release download "$1" -p "$2" -D manifests --clobber --repo "${{ github.repository }}"
            [ "$(jq -r .version "manifests/$2")" = "$V" ] || { echo "::error::$2 is for another version. Left alone."; exit 1; }
            # two keys with the same file: the updater looks for darwin-aarch64-app first and then darwin-aarch64
            jq --arg sig "$SIGNATURE" --arg url "$URL" '{signature: $sig, url: $url} as $entry | .platforms["darwin-aarch64-app"] = $entry | .platforms["darwin-aarch64"] = $entry' "manifests/$2" > "manifests/$2.new"
            mv "manifests/$2.new" "manifests/$2"
            gh release upload "$1" "manifests/$2" --clobber --repo "${{ github.repository }}"
          }
          add_mac "v$V" latest.json
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.0$ ]] || [ "$PROMOTE" = "true" ]; then add_mac channel-stable stable.json; fi

  # ---- The Linux downloads. Same rules as the Mac: only after the Windows release succeeded, built with no secrets.
  linux-app:
    needs: release
    uses: ./.github/workflows/linux-app.yml

  linux-publish:
    needs: linux-app
    runs-on: ubuntu-latest
    environment: release # the update signing key lives here: this job waits for the maintainer's approval, like the Windows one
    # mac-publish edits the same latest.json and stable.json: one at a time, so neither overwrites the other's entry
    concurrency:
      group: update-manifests-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write # attach the files to the release and add the Linux entry to the update manifests
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The signing tool comes from package-lock.json (npm ci), the same pinned one the Windows job uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-app
          path: linux-out
      - name: Attach the Linux downloads to the release
        shell: bash
        run: |
          cd linux-out
          APPIMAGE=$(ls Keystroke-Overlay_*_linux-x86_64.AppImage)
          V=${APPIMAGE#Keystroke-Overlay_}; V=${V%_linux-x86_64.AppImage}
          gh release upload "v$V" "$APPIMAGE" "Keystroke-Overlay_${V}_linux-amd64.deb" --clobber --repo "${{ github.repository }}"

      # The key is given to this one step only. The AppImage it signs was built by linux-app.yml, which has no secrets.
      - name: Sign the AppImage for the updater and add Linux to the update manifests
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PROMOTE: ${{ inputs.promote_to_stable }}
        run: |
          set -euo pipefail
          APPIMAGE=$(cd linux-out && ls Keystroke-Overlay_*_linux-x86_64.AppImage)
          V=${APPIMAGE#Keystroke-Overlay_}; V=${V%_linux-x86_64.AppImage}
          # --app-version puts the version inside the signature, so an old signed AppImage can't be passed off as a new
          # version (the app has requireSignedVersion on; the Windows installer is signed the same way in tools/release.mjs)
          npx --no-install tauri signer sign --app-version "$V" "linux-out/$APPIMAGE" # writes linux-out/<file>.sig
          SIGNATURE=$(cat "linux-out/$APPIMAGE.sig")
          [ -n "$SIGNATURE" ] || { echo "::error::No signature was written. The Linux entry was not added."; exit 1; }
          URL="https://github.com/${{ github.repository }}/releases/download/v$V/$APPIMAGE"
          # add the entry to a manifest, but only to the manifest of THIS version (never to an older Stable)
          add_linux() { # $1 = release tag that holds the manifest, $2 = manifest file name
            mkdir -p manifests && gh release download "$1" -p "$2" -D manifests --clobber --repo "${{ github.repository }}"
            [ "$(jq -r .version "manifests/$2")" = "$V" ] || { echo "::error::$2 is for another version. Left alone."; exit 1; }
            # two keys with the same file: the updater looks for linux-x86_64-appimage first and then linux-x86_64; a copy
            # installed from the .deb never asks (the app says it can't update itself)
            jq --arg sig "$SIGNATURE" --arg url "$URL" '{signature: $sig, url: $url} as $entry | .platforms["linux-x86_64-appimage"] = $entry | .platforms["linux-x86_64"] = $entry' "manifests/$2" > "manifests/$2.new"
            mv "manifests/$2.new" "manifests/$2"
            gh release upload "$1" "manifests/$2" --clobber --repo "${{ github.repository }}"
          }
          add_linux "v$V" latest.json
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.0$ ]] || [ "$PROMOTE" = "true" ]; then add_linux channel-stable stable.json; fi
