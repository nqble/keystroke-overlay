name: CI

on:
  push:
    branches: [main]
  pull_request:

# The tests only need to read the code. Read-only means a compromised step or library could not change the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Privacy promises (see PRIVACY.md)
        run: npm run check:privacy
      - name: Formatting (Prettier + rustfmt)
        run: npm run check:format
      - name: Code style (tabs, trailing spaces, final newline)
        run: npm run check:style
      - name: JavaScript syntax
        shell: bash
        run: for f in ui/overlay/*.js ui/overlay/*/*.js ui/settings/*.js tools/*.mjs; do node --check "$f"; done
      - name: Rust lints (clippy, warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the app (no installer)
        run: npx tauri build --no-bundle

  # The app is Windows-first, but everything except keyboard capture builds and runs elsewhere (docs/CROSS-PLATFORM.md).
  # This job keeps it that way, so people on Linux and macOS can work on the code and run the tests.
  other-systems:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS has not had a first green run yet. Remove this line once it passes, so it counts like the others.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries for the app window and tray
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Privacy promises (see PRIVACY.md)
        run: npm run check:privacy
      - name: UI unit tests
        run: npm run test:ui
      - name: Rust lints (clippy, warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
