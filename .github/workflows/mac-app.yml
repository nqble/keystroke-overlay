name: Mac app

# Builds the Mac app (Apple Silicon): "Keystroke Overlay.app" and the third-party notices, zipped as
# Keystroke-Overlay_<version>_macOS-arm64.zip and handed on as the workflow artifact "mac-app". It is not signed or
# notarized by Apple (docs/MAC-PORT.md, docs/RELEASING.md, Mac download); the build only signs it ad hoc, which Apple
# Silicon needs to run it at all.
#
# Two callers: ci.yml builds it on every change, so a break shows up before release day, and release.yml builds it
# after the Windows release is published and attaches the zip to that release. It uses no secrets and no shared build
# cache, so nothing another workflow wrote can end up in the zip. Every action is pinned to an exact commit, like the
# others. Run by hand: Actions -> "Mac app" -> Run workflow.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci

      - name: Privacy promises (see PRIVACY.md)
        run: npm run check:privacy

      # The licences of the libraries inside the Mac app, which go with it. Stops the build if a library uses a licence
      # not accepted in src-tauri/about.toml.
      - name: Write the third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          node tools/notices.mjs --target aarch64-apple-darwin --out build/THIRD-PARTY-NOTICES.html

      # The update signing key is not given to this job: Mac updates are not installed by the app yet.
      - name: Build the app
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The build signs only the program inside the app, so the signature does not cover the whole app and a downloaded
      # copy could be reported as damaged. Signing the whole app ad hoc fixes that (no Apple account needed), and the
      # check makes the build fail if it is still not valid.
      - name: Sign the whole app ad hoc and check it
        run: |
          APP="src-tauri/target/release/bundle/macos/Keystroke Overlay.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Zip the app with the notices
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p stage
          cp -R "src-tauri/target/release/bundle/macos/Keystroke Overlay.app" stage/
          cp build/THIRD-PARTY-NOTICES.html stage/
          ditto -c -k --sequesterRsrc stage "Keystroke-Overlay_${VERSION}_macOS-arm64.zip"
          ls -l Keystroke-Overlay_*_macOS-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: Keystroke-Overlay_*_macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
