# Dependabot opens a pull request when a library or a GitHub Action has a new version. Each one is reviewed and merged
# by Jordan like any other change (CLAUDE.md: every crate runs next to a keyboard hook); nothing updates by itself. The
# workflows pin every action to an exact commit for supply-chain safety, and the github-actions entry keeps those pins current.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
